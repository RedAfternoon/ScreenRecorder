plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.screenrecorder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.screenrecorder"
        minSdk 24          // Android 7.0+ covers every Umidigi phone still in use
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
